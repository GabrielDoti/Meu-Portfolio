spring.application.name=portfolio-api

# O Render injeta a porta na variável PORT
server.port=${PORT:8080}
# Atrás do proxy do Render, respeita os headers X-Forwarded-* (https, host)
server.forward-headers-strategy=framework

# Banco: por padrão H2 em memória (dados somem ao reiniciar). O perfil "prod" usa Postgres.
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS: domínios do front separados por vírgula (ex.: https://seu-portfolio.onrender.com)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Contato: limite por IP e limite global, dentro da janela de tempo
app.contact.max-per-window=5
app.contact.global-max-per-window=30
app.contact.window-minutes=60

# Aviso por e-mail a cada mensagem (API do Resend). Desligado se a chave ou o destino estiverem vazios.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Portfolio <onboarding@resend.dev>}
app.mail.to=${CONTACT_TO:}

# Token pra ler as mensagens em GET /api/admin/mensagens (vazio = endpoint desligado)
app.admin-token=${ADMIN_TOKEN:}

# Economiza memória no plano gratuito (512 MB)
server.tomcat.threads.max=20
